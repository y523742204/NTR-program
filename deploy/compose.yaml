services:
  postgres:
    image: postgres:18-alpine
    container_name: ntr-postgres
    restart: unless-stopped
    env_file:
      - /etc/ntr/postgres.env
    volumes:
      - /data/ntr/postgres:/var/lib/postgresql
      - ./init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ntr
    mem_limit: 640m
    cpus: 0.75
    pids_limit: 128
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  api-prod:
    image: ${PROD_IMAGE}
    container_name: ntr-api-prod
    restart: unless-stopped
    init: true
    env_file:
      - /etc/ntr/prod.env
    environment:
      API_PORT: 3000
      UPLOAD_ROOT: /app/uploads
      WECHAT_MINIPROGRAM_STATE: formal
    ports:
      - 127.0.0.1:13000:3000
    volumes:
      - /data/ntr/prod/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ntr
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
      # Remove after the shared server is upgraded from Docker 20.10.1.
      - seccomp=unconfined
    cap_drop:
      - ALL
    logging: *logging

  api-test:
    image: ${TEST_IMAGE}
    container_name: ntr-api-test
    restart: unless-stopped
    init: true
    env_file:
      - /etc/ntr/test.env
    environment:
      API_PORT: 3000
      UPLOAD_ROOT: /app/uploads
      WECHAT_MINIPROGRAM_STATE: trial
    ports:
      - 127.0.0.1:13100:3000
    volumes:
      - /data/ntr/test/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ntr
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
      # Remove after the shared server is upgraded from Docker 20.10.1.
      - seccomp=unconfined
    cap_drop:
      - ALL
    logging: *logging

networks:
  ntr:
    name: ntr-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.240.0/24
