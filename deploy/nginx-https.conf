server {
    listen 80;
    server_name server.mojiekj.com test-server.mojiekj.com;

    location ^~ /.well-known/acme-challenge/ {
        root /data/ntr/certbot/www;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name server.mojiekj.com;
    client_max_body_size 6m;

    ssl_certificate /data/ntr/certbot/letsencrypt/live/ntr/fullchain.pem;
    ssl_certificate_key /data/ntr/certbot/letsencrypt/live/ntr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ntr_SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name test-server.mojiekj.com;
